name: build

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build and run JUnit and Fabric GameTest
        run: ./gradlew build runGameTest --no-daemon --console=plain
      - name: Upload mod jars
        uses: actions/upload-artifact@v7
        with:
          name: touys-26.3-fabric
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload test reports and GameTest logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: touys-test-results
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/run/gameTest/logs/
            build/run/gameTest/crash-reports/
          if-no-files-found: warn
          retention-days: 14
